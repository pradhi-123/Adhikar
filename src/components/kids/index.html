
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhikar - Your Story World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Quicksand:wght@400;500;600;700&family=Kalam:wght@400;700&family=Kavivanar&display=swap" rel="stylesheet">
    <style>
        body {
            overflow-x: hidden;
            background-color: #fef9c3; /* Soft yellow background */
            transition: font-family 0.3s ease;
        }
        
        /* Language-specific Body Fonts */
        .lang-en { font-family: 'Quicksand', sans-serif; }
        .lang-hi { font-family: 'Kalam', cursive; }
        .lang-ta { font-family: 'Kavivanar', cursive; }

        .cartoon-logo {
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 0.05em;
            text-shadow: 3px 3px 0px #ffffff;
            -webkit-text-stroke: 1px #1e3a8a;
        }
        
        /* Ensure Hindi/Tamil logo also looks cartoonish if translated */
        .lang-hi .cartoon-logo {
            font-family: 'Kalam', cursive;
            -webkit-text-stroke: 1.5px #1e3a8a;
            font-weight: 700;
        }
        .lang-ta .cartoon-logo {
            font-family: 'Kavivanar', cursive;
            -webkit-text-stroke: 1.5px #1e3a8a;
            font-weight: 700;
        }

        .bounce-gentle {
            animation: bounce 3s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .sparkle {
            animation: sparkle-anim 1.5s infinite;
        }
        @keyframes sparkle-anim {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .phone-shake {
            animation: shake 0.5s infinite;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .comic-bubble {
            position: relative;
            background: #ffffff;
            border-radius: 20px;
            border: 3px solid #3b82f6;
        }
        .comic-bubble:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 0;
            height: 0;
            border: 15px solid transparent;
            border-top-color: #3b82f6;
            border-bottom: 0;
            border-left: 0;
            margin-left: -7.5px;
            margin-bottom: -15px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
